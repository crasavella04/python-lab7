x-app-image: &app-image
  build:
    context: .
    target: runtime
  image: python-lab7:local

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  # одноразовый контейнер: накатывает миграции и завершается
  migrate:
    <<: *app-image
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app-image
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tasks
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # тесты: docker compose run --rm tests (в обычный up не входит)
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tasks_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
